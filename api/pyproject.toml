[project]
name = "sauron-api"
version = "0.1.0"
description = "FastAPI backend: cameras CRUD, events store, KPIs, WebSocket alerts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "minio>=7.2",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "yt-dlp>=2026.1",
    "httpx>=0.27",
    "pgvector>=0.3",
    "onnxruntime>=1.19",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "tokenizers>=0.20",
    "pywebpush>=2.0",
    "aiosmtplib>=3.0",
    "authlib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.3",
    "mypy>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sauron_api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends() in defaults is the idiomatic pattern

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
