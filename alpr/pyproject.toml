[project]
name = "sauron-alpr"
version = "0.1.0"
description = "FastALPR camera worker and live diagnostics for Sauron"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fast-alpr==0.4.0",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.19.2,<2"]
onnx-gpu = ["onnxruntime-gpu>=1.23,<2"]
dev = [
    "onnxruntime>=1.19.2,<2",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sauron_alpr"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
