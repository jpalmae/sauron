name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/sauron

jobs:
  inference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inference
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[dev]" --python .venv/bin/python
      - run: .venv/bin/ruff check src tests tools
      - run: .venv/bin/python -m mypy src --ignore-missing-imports
      - run: .venv/bin/python -m pytest -q

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[dev]" --python .venv/bin/python
      - run: .venv/bin/ruff check src tests alembic
      - run: .venv/bin/python -m mypy src --ignore-missing-imports
      - run: .venv/bin/python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/sauron
      - run: helm template sauron deploy/helm/sauron --set branding.domain=ci.example.com > /dev/null

  images:
    runs-on: ubuntu-latest
    needs: [inference, api, web, helm]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: deploy/docker/api.Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: web
            dockerfile: deploy/docker/web.Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: inference
            dockerfile: deploy/docker/inference.Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - name: Cache baked ONNX models
        uses: actions/cache@v4
        with:
          path: inference/models
          key: models-${{ hashFiles('inference/src/sauron_inference/models.py') }}
      - name: Export ONNX catalog (cache miss)
        working-directory: inference
        run: |
          pip install ultralytics onnx onnxslim
          python tools/export_models.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
