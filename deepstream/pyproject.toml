[project]
name = "sauron-deepstream"
version = "0.1.0"
description = "NVIDIA DeepStream video plane for Sauron"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "numpy>=1.26,<2",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.6,<3",
    "pillow>=10,<13",
    "PyYAML>=6,<7",
    "redis>=5,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<10",
    "ruff>=0.3",
]

[project.scripts]
sauron-deepstream = "sauron_deepstream.app:main"
sauron-calibrate = "sauron_deepstream.calibration:main"
sauron-eval-capture = "sauron_deepstream.evaluation_capture:main"
sauron-evaluate = "sauron_deepstream.evaluation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sauron_deepstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
