name: sauron

services:
  deepstream:
    build:
      context: .
      dockerfile: deploy/docker/deepstream.Dockerfile
    image: sauron/deepstream:0.1.0
    profiles: ["gpu"] # requires nvidia-container-toolkit on the host
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: GPU-bdd8d90e-0c61-c97f-1cbf-1f48cc722f9d
      SAURON_DS_PGIE_TEMPLATE: /app/deepstream/configs/pgie_yolox.ini.tmpl
      SAURON_DS_PRIMARY_MODEL: /models/tao/yolox_s_dyn.onnx
      SAURON_DS_PRIMARY_LABELS: /models/tao/yolox_labels.txt
      SAURON_DS_ALLOWED_CLASSES: person,bicycle,car,motorcycle,bus,truck,dog
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      SAURON_REDIS_URL: redis://redis:6379/0
      SAURON_API_URL: http://api:8000
      SAURON_INGEST_TOKEN: ${INGEST_TOKEN}
      SAURON_DS_ROOT: /app/deepstream
      SAURON_DS_ENGINE_DIR: /models/deepstream
      SAURON_DS_MAX_STREAMS: ${DEEPSTREAM_MAX_STREAMS:-20}
      SAURON_DS_SHARD_INDEX: "0"
      SAURON_DS_SHARD_COUNT: "1"
      SAURON_DS_SECONDARY_BATCH: ${DEEPSTREAM_SECONDARY_BATCH:-64}
      SAURON_DS_TARGET_FPS: ${DEEPSTREAM_TARGET_FPS:-10}
      SAURON_DS_INFERENCE_INTERVAL: ${DEEPSTREAM_INFERENCE_INTERVAL:-0}
      SAURON_DS_SOURCE_POLL_S: "15"
      SAURON_DS_SOURCE_STALE_S: "45"
      SAURON_DS_RECOVERY_COOLDOWN_S: "45"
      SAURON_DS_RECOVERY_ATTEMPTS: "3"
      SAURON_DS_SOURCE_REST_PORT: "9010"
      SAURON_DS_HEALTH_PORT: "9100"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Request the NVIDIA device through Compose; the driver feature
              # mounts (compute/video/utility) are selected by the environment
              # above. Adding `video` here prevents NVML from being mounted on
              # some NVIDIA Container Toolkit versions, so nvmultiurisrcbin
              # cannot be created even though CUDA itself is available.
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - deepstream-engines:/models
    ports:
      - "9100:9100" # prometheus metrics + healthz
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15m
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    image: sauron/api:0.1.0
    restart: unless-stopped
    environment:
      SAURON_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sauron}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-sauron}
      SAURON_REDIS_URL: redis://redis:6379/0
      SAURON_S3_ENDPOINT: minio:9000
      SAURON_S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost:8080}
      SAURON_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-sauron}
      SAURON_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SAURON_S3_BUCKET: ${EVENTS_BUCKET:-sauron-events}
      SAURON_BRANDING_APP_NAME: ${APP_NAME:-Sauron}
      SAURON_BRANDING_COMPANY_NAME: ${COMPANY_NAME:-}
      SAURON_BRANDING_PRIMARY_COLOR: ${BRAND_PRIMARY_COLOR:-#0E7C66}
      SAURON_AUTH_ENABLED: ${AUTH_ENABLED:-true}
      SAURON_SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      SAURON_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sauron.local}
      SAURON_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SAURON_INGEST_TOKEN: ${INGEST_TOKEN:?set INGEST_TOKEN in .env}
      SAURON_VAPID_PRIVATE_KEY: ${SAURON_VAPID_PRIVATE_KEY:-}
      SAURON_VAPID_PUBLIC_KEY: ${SAURON_VAPID_PUBLIC_KEY:-}
      SAURON_RETENTION_DAYS: ${RETENTION_DAYS:-90}
      SAURON_S3_RETENTION_DAYS: ${S3_RETENTION_DAYS:-90}
      SAURON_OIDC_PROVIDERS_JSON: ${OIDC_PROVIDERS_JSON:-}
      SAURON_OIDC_REDIRECT_BASE: ${OIDC_REDIRECT_BASE:-http://localhost:8080}
      SAURON_OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      SAURON_LIVE_GO2RTC_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    image: sauron/web:0.1.0
    restart: unless-stopped
    environment:
      # base64 de usuario:contraseña del servicio ALPR para el proxy /alpr/
      ALPR_BASIC_TOKEN: ${ALPR_BASIC_TOKEN:-}
    ports:
      - "${WEB_PORT:-8080}:80"
      - "8092:80" # pool separado para streams MJPEG de Matrículas
    volumes:
      # white-label: drop client logos/favicon here, no rebuild needed
      - ./brand:/usr/share/nginx/html/brand:ro
      - ./deploy/docker/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api

  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    volumes:
      - ./deploy/go2rtc:/config
    ports:
      - "1984:1984"   # WebUI + API
      - "8554:8554"   # RTSP
      - "8555:8555"
      - "8555:8555/udp"

  alpr:
    build:
      context: .
      dockerfile: deploy/docker/alpr.Dockerfile
    image: sauron/alpr:0.1.0
    profiles: ["alpr"]
    restart: unless-stopped
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      SAURON_ALPR_DEVICE: cuda
      SAURON_ALPR_GO2RTC_URL: http://go2rtc:1984
      SAURON_ALPR_API_URL: http://api:8000/api/v1
      SAURON_ALPR_INGEST_TOKEN: ${INGEST_TOKEN}
      SAURON_ALPR_USER: ${ADMIN_EMAIL:-admin@sauron.local}
      SAURON_ALPR_PASSWORD: ${ADMIN_PASSWORD}
      SAURON_ALPR_STREAMS: ${ALPR_STREAMS:-cam-10,cam-166=cam-166-hd,cam-196,cam-212,cam-39=cam-39-hd,cam-75,caltrans-i5-43rd=public-i5-43rd,caltrans-us50-howe=public-us50-howe}
      SAURON_ALPR_TARGET_FPS: ${ALPR_TARGET_FPS:-2}
      SAURON_ALPR_STALE_AFTER_S: ${ALPR_STALE_AFTER_S:-30}
      SAURON_ALPR_VEHICLE_API_URL: ${ALPR_VEHICLE_API_URL:-https://api.boostr.cl/vehicle/{plate}.json}
      SAURON_ALPR_VEHICLE_API_KEY: ${ALPR_VEHICLE_API_KEY:-}
      SAURON_ALPR_VEHICLE_INCLUDE_OWNER: ${ALPR_VEHICLE_INCLUDE_OWNER:-false}
      SAURON_ALPR_VEHICLE_PROVIDER: ${ALPR_VEHICLE_PROVIDER:-}
      SAURON_ALPR_VEHICLE_CAMERAS: ${ALPR_VEHICLE_CAMERAS:-}
      SAURON_ALPR_VALIDATE_PLATE: ${ALPR_VALIDATE_PLATE:-false}
      SAURON_ALPR_QUERY_DET_CONF: ${ALPR_QUERY_DET_CONF:-1.0}
      SAURON_ALPR_QUERY_OCR_CONF: ${ALPR_QUERY_OCR_CONF:-1.0}
      SAURON_ALPR_MATRICULA_USERNAME: ${ALPR_MATRICULA_USERNAME:-}
      SAURON_ALPR_MATRICULA_KEY: ${ALPR_MATRICULA_KEY:-}
      SAURON_ALPR_MATRICULA_ENDPOINT: ${ALPR_MATRICULA_ENDPOINT:-https://www.regcheck.org.uk/api/reg.asmx}
      SAURON_ALPR_MATRICULA_OPERATION: ${ALPR_MATRICULA_OPERATION:-CheckChile}
      SAURON_ALPR_REGION: ${ALPR_REGION:-}
      SAURON_ALPR_BESTSHOT_WAIT_S: ${ALPR_BESTSHOT_WAIT_S:-4}
      SAURON_ALPR_BESTSHOT_CONF: ${ALPR_BESTSHOT_CONF:-0.95}
      SAURON_ALPR_DETECTOR_CONFIDENCE: ${ALPR_DETECTOR_CONFIDENCE:-0.25}
      SAURON_ALPR_OCR_CONFIDENCE: ${ALPR_OCR_CONFIDENCE:-0.65}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ALPR_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    volumes:
      - alpr-models:/root/.cache
    ports:
      - "${ALPR_PORT:-8091}:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8091/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 5m
    depends_on:
      api:
        condition: service_healthy
      go2rtc:
        condition: service_started

  # Optional RTSP -> WebRTC gateway for the live grid (WHEP players).
  # Add each camera as a path in mediamtx.yml and enable with:
  #   docker compose --profile streaming up -d mediamtx
  mediamtx:
    image: bluenviron/mediamtx:latest
    profiles: ["streaming"]
    restart: unless-stopped
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8889:8889" # WebRTC/WHEP
      - "8554:8554" # RTSP

  # Optional metrics stack. Enable with:
  #   docker compose --profile observability up -d prometheus
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sauron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sauron}
    volumes:
      # timescaledb-ha stores PGDATA below /home/postgres/pgdata. Mounting the
      # Debian PostgreSQL path leaves the real database in the container layer.
      - timescale-data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sauron}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sauron}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      EVENTS_BUCKET: ${EVENTS_BUCKET:-sauron-events}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${EVENTS_BUCKET}"
        mc anonymous set download "local/$${EVENTS_BUCKET}/public"

volumes:
  timescale-data:
  redis-data:
  minio-data:
  deepstream-engines:
  alpr-models:
  prometheus-data:
