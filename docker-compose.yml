name: sauron

services:
  deepstream:
    build:
      context: .
      dockerfile: deploy/docker/deepstream.Dockerfile
    image: sauron/deepstream:0.1.0
    profiles: ["gpu"] # requires nvidia-container-toolkit on the host
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      SAURON_REDIS_URL: redis://redis:6379/0
      SAURON_API_URL: http://api:8000
      SAURON_INGEST_TOKEN: ${INGEST_TOKEN}
      SAURON_DS_ROOT: /app/deepstream
      SAURON_DS_ENGINE_DIR: /models/deepstream
      SAURON_DS_MAX_STREAMS: ${DEEPSTREAM_MAX_STREAMS:-20}
      SAURON_DS_SHARD_INDEX: "0"
      SAURON_DS_SHARD_COUNT: "1"
      SAURON_DS_SECONDARY_BATCH: ${DEEPSTREAM_SECONDARY_BATCH:-64}
      SAURON_DS_TARGET_FPS: ${DEEPSTREAM_TARGET_FPS:-10}
      SAURON_DS_INFERENCE_INTERVAL: ${DEEPSTREAM_INFERENCE_INTERVAL:-0}
      SAURON_DS_SOURCE_POLL_S: "15"
      SAURON_DS_SOURCE_STALE_S: "45"
      SAURON_DS_RECOVERY_COOLDOWN_S: "45"
      SAURON_DS_RECOVERY_ATTEMPTS: "3"
      SAURON_DS_SOURCE_REST_PORT: "9010"
      SAURON_DS_HEALTH_PORT: "9100"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Request the NVIDIA device through Compose; the driver feature
              # mounts (compute/video/utility) are selected by the environment
              # above. Adding `video` here prevents NVML from being mounted on
              # some NVIDIA Container Toolkit versions, so nvmultiurisrcbin
              # cannot be created even though CUDA itself is available.
              capabilities: [gpu]
    volumes:
      - deepstream-engines:/models
    ports:
      - "9100:9100" # prometheus metrics + healthz
    healthcheck:
      test: ["CMD", "/opt/sauron/bin/python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9100/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15m
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    image: sauron/api:0.1.0
    restart: unless-stopped
    environment:
      SAURON_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sauron}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-sauron}
      SAURON_REDIS_URL: redis://redis:6379/0
      SAURON_S3_ENDPOINT: minio:9000
      SAURON_S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost:8080}
      SAURON_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-sauron}
      SAURON_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SAURON_S3_BUCKET: ${EVENTS_BUCKET:-sauron-events}
      SAURON_BRANDING_APP_NAME: ${APP_NAME:-Sauron}
      SAURON_BRANDING_COMPANY_NAME: ${COMPANY_NAME:-}
      SAURON_BRANDING_PRIMARY_COLOR: ${BRAND_PRIMARY_COLOR:-#0E7C66}
      SAURON_AUTH_ENABLED: ${AUTH_ENABLED:-true}
      SAURON_SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      SAURON_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sauron.local}
      SAURON_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SAURON_INGEST_TOKEN: ${INGEST_TOKEN:?set INGEST_TOKEN in .env}
      SAURON_VAPID_PRIVATE_KEY: ${SAURON_VAPID_PRIVATE_KEY:-}
      SAURON_VAPID_PUBLIC_KEY: ${SAURON_VAPID_PUBLIC_KEY:-}
      SAURON_RETENTION_DAYS: ${RETENTION_DAYS:-90}
      SAURON_S3_RETENTION_DAYS: ${S3_RETENTION_DAYS:-90}
      SAURON_OIDC_PROVIDERS_JSON: ${OIDC_PROVIDERS_JSON:-}
      SAURON_OIDC_REDIRECT_BASE: ${OIDC_REDIRECT_BASE:-http://localhost:8080}
      SAURON_OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      SAURON_LIVE_GO2RTC_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    image: sauron/web:0.1.0
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # white-label: drop client logos/favicon here, no rebuild needed
      - ./brand:/usr/share/nginx/html/brand:ro
    depends_on:
      - api

  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    volumes:
      - ./deploy/go2rtc:/config
    ports:
      - "1984:1984"   # WebUI + API
      - "8554:8554"   # RTSP
      - "8555:8555"
      - "8555:8555/udp"

  # Optional RTSP -> WebRTC gateway for the live grid (WHEP players).
  # Add each camera as a path in mediamtx.yml and enable with:
  #   docker compose --profile streaming up -d mediamtx
  mediamtx:
    image: bluenviron/mediamtx:latest
    profiles: ["streaming"]
    restart: unless-stopped
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8889:8889" # WebRTC/WHEP
      - "8554:8554" # RTSP

  # Optional metrics stack. Enable with:
  #   docker compose --profile observability up -d prometheus
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sauron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sauron}
    volumes:
      # timescaledb-ha stores PGDATA below /home/postgres/pgdata. Mounting the
      # Debian PostgreSQL path leaves the real database in the container layer.
      - timescale-data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sauron}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sauron}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      EVENTS_BUCKET: ${EVENTS_BUCKET:-sauron-events}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${EVENTS_BUCKET}"
        mc anonymous set download "local/$${EVENTS_BUCKET}/public"

volumes:
  timescale-data:
  redis-data:
  minio-data:
  deepstream-engines:
  prometheus-data:
