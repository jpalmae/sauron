# Local control-plane demo. Video analytics requires an NVIDIA host and the
# `gpu` profile; this override only seeds cameras and configures live preview.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  api:
    environment:
      SAURON_SEED_CAMERAS_PATH: /seed/cameras.json
      # Live preview: RTSP cameras se sirven via go2rtc (WHEP) a traves del nginx /go2rtc/
      SAURON_LIVE_GO2RTC_ENABLED: "true"
    volumes:
      - ./deploy/seed/cameras.local.json:/seed/cameras.json:ro

  # Montar nginx.conf (sin reconstruir la imagen web) para activar el proxy /go2rtc/
  web:
    volumes:
      - ./brand:/usr/share/nginx/html/brand:ro
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # go2rtc config is shared via ./deploy/go2rtc (see main compose)
