# Local demo override (CPU-only): GUI-driven cameras via the Sauron API.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml --profile local up -d --build
# inference-local: CPU image. Streams come from the API (GET /cameras/active);
# the pipeline YAML only provides defaults (detector=onnx, tracker, classes).
services:
  api:
    environment:
      # desactivado: gestion manual de camaras (dev). Re-activar para el seed demo.
      # SAURON_SEED_CAMERAS_PATH: /seed/cameras.json
      # Live preview: RTSP cameras se sirven via go2rtc (WHEP) a traves del nginx /go2rtc/
      SAURON_LIVE_GO2RTC_ENABLED: "true"
    volumes:
      - ./deploy/seed/cameras.local.json:/seed/cameras.json:ro

  # Montar nginx.conf (sin reconstruir la imagen web) para activar el proxy /go2rtc/
  web:
    volumes:
      - ./brand:/usr/share/nginx/html/brand:ro
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  inference-local:
    profiles: ["local"]
    build:
      context: .
      dockerfile: deploy/docker/inference.local.Dockerfile
    image: sauron/inference:local
    restart: unless-stopped
    environment:
      SAURON_REDIS_URL: redis://redis:6379/0
      # GUI-driven cameras: inference polls the API and reconciles streams.
      SAURON_API_URL: http://api:8000
      SAURON_INGEST_TOKEN: ${INGEST_TOKEN}
      SAURON_API_CAMERAS_FPS: "5"
      SAURON_API_CAMERAS_POLL_S: "15"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./inference/configs:/app/configs:ro
      - ./inference/models:/app/models:ro
    ports:
      - "9100:9100"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["run", "-c", "configs/pipeline.local.yaml"]

  # go2rtc: bridges cloud cameras (Xiaomi/Mi Home, etc.) into standard RTSP so
  # Sauron can ingest them; its WHEP endpoint powers the in-browser live preview.
  # Default: bridge network. If your camera needs host-level P2P (e.g. Xiaomi
  # UDP), switch this service to `network_mode: host` and have the inference
  # service reach it via the host IP (host.docker.internal:host-gateway).
  go2rtc:
    image: alexxit/go2rtc:latest
    profiles: ["local"]
    container_name: sauron-go2rtc
    restart: unless-stopped
    volumes:
      - ./deploy/go2rtc:/config
    ports:
      - "1984:1984"   # WebUI + API (login cloud account here)
      - "8554:8554"   # RTSP (consumed by inference)
      - "8555:8555"       # WebRTC media (live preview)
      - "8555:8555/udp"
