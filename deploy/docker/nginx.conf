server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS; variables defer resolution to request time so the
    # proxy survives backends being down or absent (mediamtx is optional).
    resolver 127.0.0.11 valid=5s ipv6=off;

    # API
    location /api/ {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Live alerts WebSocket
    location /ws/ {
        set $upstream_ws http://api:8000;
        proxy_pass $upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # WHEP WebRTC player endpoints (MediaMTX gateway, optional profile)
    location /whep/ {
        set $upstream_whep http://mediamtx:8889;
        proxy_pass $upstream_whep;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 504 = @no_stream;
    }
    location @no_stream {
        return 404;
    }

    # MinIO evidence bucket, same-origin so presigned URLs work in the browser.
    # Host (with port) must match what the API signed for; path is preserved.
    # If EVENTS_BUCKET is renamed, mirror it here.
    location /sauron-events/ {
        set $upstream_minio http://minio:9000;
        proxy_pass $upstream_minio;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets: long cache; brand assets: no cache (white-label swaps)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /brand/ {
        add_header Cache-Control "no-cache";
    }
}
