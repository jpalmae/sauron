# Token JWT para /alpr/ vía cookie: los <img> MJPEG no pueden enviar el
# header Authorization, pero sí cookies (heredadas por auth_request).
map $http_cookie $sauron_cookie_token {
    default "";
    "~*(^|;\s*)sauron_token=(?<sauron_token_value>[^;]+)" $sauron_token_value;
}

server {
    # 8092 existe para que los MJPEG vivan en otro pool de conexiones:
    # los navegadores limitan ~6 conexiones por host:puerto (HTTP/1.1).
    listen 80;
    listen 8092;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Preservar el puerto publicado por Docker en redirecciones generadas.
    absolute_redirect off;

    # Compresión para assets y JSON (el bundle JS pesa ~1.4 MB sin gzip).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/wasm
        text/xml
        application/xml;

    # Docker embedded DNS; variables defer resolution to request time so the
    # proxy survives backends being down or absent (mediamtx is optional).
    resolver 127.0.0.11 valid=5s ipv6=off;

    # API
    location /api/ {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Live alerts WebSocket
    location /ws/ {
        set $upstream_ws http://api:8000;
        proxy_pass $upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # WHEP WebRTC player endpoints (MediaMTX gateway, optional profile)
    location /whep/ {
        set $upstream_whep http://mediamtx:8889;
        proxy_pass $upstream_whep;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 504 = @no_stream;
    }

    # go2rtc WHEP signaling (Xiaomi/Mi Home bridge). Same-origin proxy so the
    # browser doesn't need CORS. WebRTC media (UDP/TCP 8555) goes direct to
    # go2rtc (host network). go2rtc runs on the host network; reach it via the
    # go2rtc WebRTC signaling bridge (same-origin so the browser needs no CORS).
    # go2rtc runs on the compose network; WebRTC media (8555) reaches the client
    # via the published port. NOTE: some cloud cameras (e.g. Xiaomi P2P/UDP)
    # require go2rtc on `network_mode: host` instead — see deploy/go2rtc/.
    location /go2rtc/ {
        set $upstream_go2rtc http://go2rtc:1984;
        rewrite ^/go2rtc/(.*)$ /$1 break;
        proxy_pass $upstream_go2rtc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 504 = @no_stream;
    }

    # Ruta del SPA "Matrículas": la página vive en el React, no en el proxy.
    # Rutas SPA bajo /alpr/ se sirven desde React, no del proxy FastALPR.
    location = /alpr/config {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /alpr/eventos {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /alpr {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /alpr/ {
        return 302 /alpr;
    }

    # FastALPR (perfil alpr). SSO de Sauron: JWT por header Authorization o
    # cookie sauron_token. El upstream recibe las credenciales del servicio
    # via ALPR_BASIC_TOKEN (base64 usuario:contraseña) inyectada por envsubst.
    location /alpr/ {
        set $upstream_alpr http://alpr:8091;
        auth_request /_alpr_auth;
        rewrite ^/alpr/(.*)$ /$1 break;
        proxy_pass $upstream_alpr;
        proxy_set_header Authorization "Basic ${ALPR_BASIC_TOKEN}";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_intercept_errors on;
        error_page 502 504 = @no_stream;
    }

    # Health de DeepStream (misma autenticación SSO que /alpr/).
    location /deepstream/ {
        set $upstream_ds http://deepstream:9100;
        auth_request /_alpr_auth;
        rewrite ^/deepstream/(.*)$ /$1 break;
        proxy_pass $upstream_ds;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 504 = @no_stream;
    }

    location = /_alpr_auth {
        internal;
        set $sauron_auth $http_authorization;
        if ($sauron_cookie_token != "") {
            set $sauron_auth "Bearer $sauron_cookie_token";
        }
        set $upstream_auth http://api:8000;
        proxy_pass $upstream_auth/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $sauron_auth;
    }

    location @no_stream {
        return 404;
    }

    # MinIO evidence bucket, same-origin so presigned URLs work in the browser.
    # Host (with port) must match what the API signed for; path is preserved.
    # If EVENTS_BUCKET is renamed, mirror it here.
    location /sauron-events/ {
        set $upstream_minio http://minio:9000;
        proxy_pass $upstream_minio;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (no cache: index.html must revalidate to pick new builds)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets: long cache; brand assets: no cache (white-label swaps)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /brand/ {
        add_header Cache-Control "no-cache";
    }
}
