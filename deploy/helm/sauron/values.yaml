# Sauron Helm values — rebrand and resize without touching templates.
image:
  registry: ""            # e.g. registry.cliente.com/sauron
  tag: "0.1.0"
  pullPolicy: IfNotPresent

branding:
  appName: Sauron
  companyName: ""
  primaryColor: "#0E7C66"
  domain: ""              # e.g. vision.cliente.com — enables Ingress + TLS

# Sizing profile: xs (1 L4 / 20 streams), s (2 / 40), m (3 / 60)
profile: xs

deepstream:
  enabled: true
  # 0 selects the replica count from `profile`; every replica owns one GPU.
  replicas: 0
  maxStreamsPerGpu: 20
  image: sauron/deepstream
  metricsPort: 9100
  sourceRestPort: 9010
  targetFps: 10
  inferenceInterval: 0
  secondaryBatch: 64
  sourcePollSeconds: 15
  sourceStaleSeconds: 45
  recoveryCooldownSeconds: 45
  recoveryAttempts: 3
  nodeSelector: {}        # e.g. { hpe.com/gpu: "l4" }
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      memory: 16Gi

api:
  replicas: 1
  image: sauron/api

web:
  replicas: 1
  image: sauron/web

# Bundled infra is for evaluation. In production point these at managed
# services / operators (CloudNativePG, Redis operator, MinIO operator).
database:
  host: sauron-timescaledb
  port: 5432
  name: sauron
  user: sauron
redis:
  url: redis://sauron-redis:6379/0
s3:
  endpoint: sauron-minio:9000
  bucket: sauron-events
  accessKey: sauron

auth:
  enabled: true
  adminEmail: admin@sauron.local

# Evaluation defaults only. In production set create=false, provide an
# existing Secret with these five keys, and never keep credentials in values.
secrets:
  create: true
  name: sauron-secrets
  postgresPassword: change-me
  s3SecretKey: change-me
  ingestToken: change-me
  jwtSecret: change-me
  adminPassword: change-me

persistence:
  storageClass: ""        # cluster default
  size: 20Gi
