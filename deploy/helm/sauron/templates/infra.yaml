# Evaluation-grade bundled infra. For production use operators/managed services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sauron-timescaledb
spec:
  replicas: 1
  selector:
    matchLabels: { app: sauron-timescaledb }
  template:
    metadata:
      labels: { app: sauron-timescaledb }
    spec:
      containers:
        - name: db
          image: timescale/timescaledb-ha:pg16
          env:
            - name: POSTGRES_USER
              value: sauron
            - name: POSTGRES_PASSWORD
              value: changeme
            - name: POSTGRES_DB
              value: sauron
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: 500m, memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sauron-timescaledb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sauron-timescaledb
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: sauron-timescaledb
spec:
  selector: { app: sauron-timescaledb }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sauron-redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: sauron-redis }
  template:
    metadata:
      labels: { app: sauron-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 100m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sauron-redis
spec:
  selector: { app: sauron-redis }
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sauron-minio
spec:
  replicas: 1
  selector:
    matchLabels: { app: sauron-minio }
  template:
    metadata:
      labels: { app: sauron-minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.s3.accessKey | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.s3.secretKey | quote }}
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 200m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sauron-minio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sauron-minio
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: sauron-minio
spec:
  selector: { app: sauron-minio }
  ports:
    - port: 9000
