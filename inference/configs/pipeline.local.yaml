# Config del pipeline para cmadridasus (CPU, GUI-driven).
# Las camaras se cargan desde la API (GET /cameras/active); este YAML solo
# aporta los DEFAULTS: detector multi-modelo (pose + objetos) para analitica
# completa de personas: ocupacion + postura + caidas + sillas + ReID.
app:
  name: sauron
  redis_url: "redis://redis:6379/0"

devices: [0]

defaults:
  confidence_threshold: 0.40
  nms_threshold: 0.45
  input_size: [640, 640]
  detector:
    backend: pose_objects        # YOLOv8n-pose (personas+keypoints) + YOLOv8n (sillas)
  onnx_path: models/yolov8n-pose.onnx
  objects_onnx_path: models/yolov8n.onnx
  classes:
    0: person
  tracker:
    high_thresh: 0.40
    low_thresh: 0.10
    match_thresh: 0.80
    max_time_lost: 30
    history_size: 60
  capture:
    queue_size: 2
    use_gstreamer: false
  clips:
    enabled: true
    preroll_seconds: 6
    clip_fps: 10

streams: []
