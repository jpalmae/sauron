# Local demo config (CPU, GUI-driven cameras).
# Las cámaras se cargan desde la API (GET /cameras/active, env SAURON_API_URL);
# este YAML aporta los DEFAULTS: detector multi-modelo (pose + objetos) para
# analítica de personas (ocupación + postura + caídas + sillas + ReID).
# `streams: []` sigue funcionando como fallback cuando SAURON_API_URL no está.
app:
  name: sauron
  redis_url: "redis://redis:6379/0"

devices: [0]

defaults:
  confidence_threshold: 0.35
  nms_threshold: 0.45
  input_size: [640, 640]
  model: yolov8s
  detector:
    backend: pose_objects        # YOLOv8n-pose (personas) + YOLOv8s (clases abajo)
  pose_onnx_path: models/yolov8n-pose.onnx
  objects_onnx_path: models/yolov8s.onnx   # o `model:` del catálogo (backend onnx)
  classes:                           # modelo de objetos: vehículos + sillas
    2: car
    3: motorcycle
    5: bus
    7: truck
    62: chair
    63: couch
  tracker:
    high_thresh: 0.35
    low_thresh: 0.10
    match_thresh: 0.80
    max_time_lost: 30
    history_size: 60
  capture:
    queue_size: 2
    use_gstreamer: false   # CPU demo: FFmpeg decode (también lee HLS/m3u8)
  clips:
    enabled: true
    preroll_seconds: 6
    clip_fps: 10

# Cámaras gestionadas 100% por GUI (dashboard). Fallback estático:
streams: []
