# Local demo config: live public camera (Shinjuku, Tokio) with real ONNX CPU
# detection. Events flow to Redis -> API -> dashboard. No GPU needed.
app:
  name: sauron
  redis_url: "redis://redis:6379/0"

devices: [0]

defaults:
  confidence_threshold: 0.35
  detector:
    backend: mock
  tracker:
    high_thresh: 0.35
    low_thresh: 0.10
    max_time_lost: 30
  capture:
    queue_size: 2
    use_gstreamer: false   # CPU demo: FFmpeg decode (también lee HLS/m3u8)
  clips:
    enabled: true
    preroll_seconds: 6
    clip_fps: 10

streams:
  # Cámaras públicas en vivo (YouTube Live). El prefijo yt: resuelve y
  # refresca el manifiesto HLS automáticamente (yt-dlp).
  - id: shinjuku-live
    name: "Shinjuku Live (Tokio)"
    type: rtsp
    source: "yt:https://www.youtube.com/watch?v=gFRtAAmiFbE"
    target_fps: 5
    detector:
      backend: onnx     # CPU real: yolov8n.onnx via OpenCV DNN
    roi:
      lines:
        - id: L1
          points: [[60, 520], [1000, 520]]
      polygons:
        - id: calzada
          kind: lane
          points: [[60, 380], [1000, 380], [1100, 710], [40, 710]]
          rules: [stopped, congestion]
      thresholds:
        stopped_seconds: 10
        congestion_occupancy: 0.25
        congestion_seconds: 20
        congestion_cooldown_s: 60

  - id: ih35-aquarena
    name: "IH-35 @ Aquarena Springs (Texas)"
    type: rtsp
    source: "yt:https://www.youtube.com/watch?v=eHY0dJK7giA"
    target_fps: 5
    detector:
      backend: onnx
    roi:
      lines:
        - id: L1
          points: [[300, 450], [950, 450]]
      polygons:
        - id: freeway
          kind: lane
          points: [[300, 150], [950, 150], [1000, 700], [250, 700]]
          rules: [stopped, congestion]
      thresholds:
        stopped_seconds: 12
        congestion_occupancy: 0.30
        congestion_seconds: 30
        congestion_cooldown_s: 120

  - id: grand-avenue
    name: "Grand Avenue Bridge (Glenwood Springs)"
    type: rtsp
    source: "yt:https://www.youtube.com/watch?v=SNvppiU1-IM"
    target_fps: 5
    model: yolo11n   # override del catálogo por stream
    detector:
      backend: onnx
    roi:
      lines:
        - id: L1
          points: [[0, 550], [1280, 550]]
      polygons:
        - id: street
          kind: lane
          points: [[0, 400], [1280, 400], [1280, 700], [0, 700]]
          rules: [stopped, congestion]
      thresholds:
        stopped_seconds: 12
        congestion_occupancy: 0.30
        congestion_seconds: 30
        congestion_cooldown_s: 120
