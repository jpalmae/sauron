# Local demo config: 2 synthetic streams, mock detector, full rules on cam-01.
# Events flow to Redis -> API -> dashboard. No camera or GPU needed.
app:
  name: sauron
  redis_url: "redis://redis:6379/0"

devices: [0]

defaults:
  confidence_threshold: 0.50
  detector:
    backend: mock
  tracker:
    high_thresh: 0.50
    low_thresh: 0.10
    max_time_lost: 30
  capture:
    queue_size: 2
    use_gstreamer: false   # CPU demo: FFmpeg decode (también lee HLS/m3u8)
  clips:
    enabled: true
    preroll_seconds: 6
    clip_fps: 10

streams:
  - id: demo-norte
    name: "Demo Norte"
    type: synthetic
    source: ""
    width: 1280
    height: 720
    target_fps: 15
    roi:
      lines:
        - id: L1
          points: [[640, 0], [640, 720]]   # objetos sintéticos cruzan en x=640
      polygons:
        - id: carril-1
          kind: lane
          points: [[0, 60], [1280, 60], [1280, 300], [0, 300]]
          direction: [1, 0]
          rules: [stopped, congestion]
      thresholds:
        stopped_seconds: 4
        congestion_occupancy: 0.03
        congestion_seconds: 8
        congestion_cooldown_s: 20

  - id: demo-sur
    name: "Demo Sur"
    type: synthetic
    source: ""
    width: 1280
    height: 720
    target_fps: 15

  # Cámara pública en vivo (Shinjuku, Tokio — YouTube Live).
  # El prefijo yt: resuelve y refresca el manifiesto HLS automáticamente (yt-dlp).
  - id: shinjuku-live
    name: "Shinjuku Live (Tokio)"
    type: rtsp
    source: "yt:https://www.youtube.com/watch?v=gFRtAAmiFbE"
    target_fps: 5
    detector:
      backend: onnx     # CPU real: yolov8n.onnx via OpenCV DNN
    roi:
      lines:
        - id: L1
          points: [[60, 520], [1000, 520]]
      polygons:
        - id: calzada
          kind: lane
          points: [[60, 380], [1000, 380], [1100, 710], [40, 710]]
          rules: [stopped, congestion]
      thresholds:
        stopped_seconds: 10
        congestion_occupancy: 0.25
        congestion_seconds: 20
        congestion_cooldown_s: 60
