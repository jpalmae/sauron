app:
  name: sauron
  redis_url: "redis://redis:6379/0"
devices: [0]
defaults:
  confidence_threshold: 0.40
  nms_threshold: 0.45
  input_size: [640, 640]
  detector:
    backend: keypoint_rcnn
  classes:
    0: person
    2: car
    3: motorcycle
    5: bus
    7: truck
  tracker:
    high_thresh: 0.40
    low_thresh: 0.10
    match_thresh: 0.80
    max_time_lost: 30
    history_size: 60
  capture:
    queue_size: 2
    use_gstreamer: false
  clips:
    enabled: true
    preroll_seconds: 6
    clip_fps: 10
  fall_aspect: 1.3
  fall_cooldown_s: 20.0
  knee_bend_deg: 140.0
  posture_stable_frames: 4
  reid_sim: 0.55
  grouping_min_people: 3
  grouping_distance_px: 220.0
streams: []
