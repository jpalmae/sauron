app:
  name: sauron

# GPUs available for inference. Streams are assigned round-robin
# unless a stream overrides with `device_id`.
devices: [0]

defaults:
  engine_path: models/yolov8n_fp16.engine
  input_size: [640, 640]
  confidence_threshold: 0.50
  nms_threshold: 0.45
  # COCO vehicle classes -> project classes
  classes:
    2: car
    3: motorcycle
    5: bus
    7: truck
  tracker:
    high_thresh: 0.50
    low_thresh: 0.10
    match_thresh: 0.80
    max_time_lost: 30
    history_size: 60
  capture:
    latency_ms: 200
    reconnect_backoff_s: 2.0
    queue_size: 2

streams:
  - id: cam-01
    name: "Entrada Norte"
    type: rtsp
    source: "rtsp://user:pass@192.168.1.10:554/Streaming/Channels/101"
    device_id: 0
    target_fps: 15
    roi:
      lines:
        - id: L1-north
          points: [[100, 500], [1180, 500]]
          direction: [0, -1]   # vehicles moving "up" count as forward
          classes: [car, bus, truck, motorcycle]
      polygons:
        - id: lane-nb-1
          kind: lane
          points: [[200, 450], [1100, 450], [1200, 700], [100, 700]]
          direction: [1, 0]    # allowed flow: left -> right
          rules: [stopped, wrong_way, congestion]
      homography:
        src_points: [[200, 450], [1100, 450], [1200, 700], [100, 700]]
        dst_points: [[0, 0], [25, 0], [25, 10], [0, 10]]  # meters
      thresholds:
        stopped_seconds: 15
        wrong_way_seconds: 3
        wrong_way_cosine: -0.7
        congestion_occupancy: 0.6
        congestion_seconds: 30

  - id: cam-02
    name: "Salida Sur"
    type: rtsp
    source: "rtsp://user:pass@192.168.1.11:554/Streaming/Channels/101"
    device_id: 0
    target_fps: 15

  # File/synthetic sources are useful for benchmarks and CI
  # - id: bench
  #   name: "Benchmark"
  #   type: synthetic
  #   source: ""
  #   width: 1280
  #   height: 720
