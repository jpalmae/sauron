[project]
name = "sauron-inference"
version = "0.1.0"
description = "Multi-channel RTSP video analytics inference pipeline (YOLOv8 + TensorRT + ByteTrack)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "scipy>=1.12",
    "httpx>=0.27",
    "redis>=5.0",
]

[project.optional-dependencies]
gpu = [
    "tensorrt>=8.6",
    "cuda-python>=12.3",
]
onvif = [
    "wsdiscovery>=2.1",
    "onvif-zeep>=0.2",
]
live = [
    "yt-dlp>=2026.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.scripts]
sauron-inference = "sauron_inference.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sauron_inference"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
